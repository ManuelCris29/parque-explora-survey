AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sistema de Encuestas de Satisfacción - Parque Explora

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs22.x
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        SURVEYS_TABLE: !Ref SurveysTable
        ROOMS_TABLE: !Ref RoomsTable
        API_KEY: !Ref ApiKeyValue
        OPENAI_API_KEY: !Ref OpenAIApiKey
        OPENAI_MODEL: !Ref OpenAIModel

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  ApiKeyValue:
    Type: String
    Default: parque-explora-api-key-2024
    Description: API Key para autenticación básica
  OpenAIApiKey:
    Type: String
    Default: ''
    Description: API Key de OpenAI (opcional). Si está vacía, usa fallback heurístico.
  OpenAIModel:
    Type: String
    Default: gpt-4o-mini
    Description: Modelo de OpenAI para análisis semántico.

Resources:
  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-parque-explora-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cedula
          AttributeType: S
      KeySchema:
        - AttributeName: cedula
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  SurveysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-parque-explora-surveys'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: surveyId
          AttributeType: S
        - AttributeName: cedula
          AttributeType: S
      KeySchema:
        - AttributeName: surveyId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CedulaIndex
          KeySchema:
            - AttributeName: cedula
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-parque-explora-rooms'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: roomId
          AttributeType: S
      KeySchema:
        - AttributeName: roomId
          KeyType: HASH

  # API Gateway
  ParqueExploraApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # Unified Services - SOLID Architecture
  UserServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Environment}-user-service'
      CodeUri: backend/functions/userService/
      Handler: index.handler
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SURVEYS_TABLE: !Ref SurveysTable
          API_KEY: !Ref ApiKeyValue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SurveysTable
      Events:
        # GET /users - Get all users
        GetAllUsers:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /users
            Method: get
            Auth:
              ApiKeyRequired: true
        # POST /users - Create user
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /users
            Method: post
            Auth:
              ApiKeyRequired: true
        # GET /users/{cedula} - Get user by cedula
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /users/{cedula}
            Method: get
            Auth:
              ApiKeyRequired: true
        # PUT /users/{cedula} - Update user
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /users/{cedula}
            Method: put
            Auth:
              ApiKeyRequired: true
        # DELETE /users/{cedula} - Delete user
        DeleteUser:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /users/{cedula}
            Method: delete
            Auth:
              ApiKeyRequired: true

  SurveyServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Environment}-survey-service'
      CodeUri: backend/functions/surveyService/
      Handler: index.handler
      Environment:
        Variables:
          SURVEYS_TABLE: !Ref SurveysTable
          USERS_TABLE: !Ref UsersTable
          ROOMS_TABLE: !Ref RoomsTable
          API_KEY: !Ref ApiKeyValue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SurveysTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable
      Events:
        # GET /surveys - Get all surveys
        GetAllSurveys:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /surveys
            Method: get
            Auth:
              ApiKeyRequired: true
        # POST /surveys - Create survey
        CreateSurvey:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /surveys
            Method: post
            Auth:
              ApiKeyRequired: true
        # GET /surveys/user/{cedula} - Get survey by user cedula
        GetSurveyByUser:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /surveys/user/{cedula}
            Method: get
            Auth:
              ApiKeyRequired: true
        # GET /surveys/{surveyId} - Get survey by ID
        GetSurveyById:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /surveys/{surveyId}
            Method: get
            Auth:
              ApiKeyRequired: true
        # PUT /surveys/{surveyId} - Update survey
        UpdateSurvey:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /surveys/{surveyId}
            Method: put
            Auth:
              ApiKeyRequired: true
        # DELETE /surveys/{surveyId} - Delete survey
        DeleteSurvey:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /surveys/{surveyId}
            Method: delete
            Auth:
              ApiKeyRequired: true
        # GET /surveys/insights/ai - AI insights
        GetSurveyInsightsAi:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /surveys/insights/ai
            Method: get
            Auth:
              ApiKeyRequired: true

  RoomServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Environment}-room-service'
      CodeUri: backend/functions/roomService/
      Handler: index.handler
      Environment:
        Variables:
          ROOMS_TABLE: !Ref RoomsTable
          API_KEY: !Ref ApiKeyValue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable
      Events:
        # GET /rooms - Get all rooms
        GetAllRooms:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /rooms
            Method: get
            Auth:
              ApiKeyRequired: true
        # POST /rooms - Create room
        CreateRoom:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /rooms
            Method: post
            Auth:
              ApiKeyRequired: true
        # GET /rooms/{roomId} - Get room by ID
        GetRoom:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /rooms/{roomId}
            Method: get
            Auth:
              ApiKeyRequired: true
        # PUT /rooms/{roomId} - Update room
        UpdateRoom:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /rooms/{roomId}
            Method: put
            Auth:
              ApiKeyRequired: true
        # DELETE /rooms/{roomId} - Delete room
        DeleteRoom:
          Type: Api
          Properties:
            RestApiId: !Ref ParqueExploraApi
            Path: /rooms/{roomId}
            Method: delete
            Auth:
              ApiKeyRequired: true

  # API Key
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub '${Environment}-parque-explora-api-key'
      Description: API Key for Parque Explora Survey System
      Enabled: true

  # Usage Plan
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ParqueExploraApi
    Properties:
      UsagePlanName: !Sub '${Environment}-parque-explora-usage-plan'
      Description: Usage plan for Parque Explora API
      ApiStages:
        - ApiId: !Ref ParqueExploraApi
          Stage: !Ref Environment

  # Link API Key to Usage Plan

  ApiKeyUsagePlan:
    Type: AWS::ApiGateway::UsagePlanKey
    DependsOn: UsagePlan
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ParqueExploraApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
    Export:
      Name: !Sub "${Environment}-ParqueExploraApiUrl"
  
  ApiKey:
    Description: "API Key for accessing the API"
    Value: !Ref ApiKey
    Export:
      Name: !Sub "${Environment}-ParqueExploraApiKey"
